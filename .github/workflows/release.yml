name: Prepare release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches every package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python scripts/check-repository.py
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml','rb'))['package']['version']
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - run: cargo fmt --all -- --check && cargo test --locked && cargo clippy --all-targets --locked -- -D warnings
      - run: python scripts/test-model-checks.py
      - run: python -m unittest discover -s examples/calibration -v
      - run: cargo run --release --locked --example packet_faults
      - run: python -m pip install --require-hashes -r requirements-release.txt
      - run: python scripts/package-release.py
      - run: python scripts/check-release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: mid360-release
          path: dist/*
          if-no-files-found: error
  draft:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mid360-release
          path: dist
      - name: Create a draft for review
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file docs/release-notes.md
