[workspace]
name = "mid360-sim"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rmw-fastrtps-cpp = "*"
cmake = "*"
ninja = "*"
colcon-common-extensions = "*"

[tasks]
interfaces = "bash scripts/build-interfaces.sh"
build = { cmd = "bash scripts/with-ros.sh cargo build --release --features ros2 --locked", depends-on = ["interfaces"] }
run = { cmd = "bash scripts/with-ros.sh target/release/mid360-sim", depends-on = ["build"] }
test = { cmd = "bash scripts/with-ros.sh cargo test --features ros2 --locked", depends-on = ["interfaces"] }
smoke = { cmd = "bash scripts/with-ros.sh python scripts/smoke.py", depends-on = ["build"] }
